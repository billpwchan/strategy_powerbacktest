[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "strategy-powerbacktest"
version = "1.0.0"
description = "Bar-level backtester for HK/US equities on Futu OpenAPI data, with HK-accurate costs, board lots and an offline HTML report."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Bill Chan" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "futu-api>=9.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
pbt = "powerbacktest.cli:main"

[project.urls]
Homepage = "https://github.com/billpwchan/strategy_powerbacktest"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbacktest"]

[tool.hatch.build.targets.sdist]
include = ["src/powerbacktest", "tests/powerbacktest", "configs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/powerbacktest"]
addopts = "-ra"
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:powerbacktest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/strategy", "src/engine", "src/data", "src/utils", "src/__init__.py", "tests/strategy", "tests/test_data_resampler.py", "tests/conftest.py", "main.py", "setup.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PD002", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src/powerbacktest"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
